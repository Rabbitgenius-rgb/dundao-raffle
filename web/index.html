<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e16">
<title>断刀 · 十二系锻造工坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ffb657' d='M18 2h6v14h-4v4h6v4H8v-4h6V8h4zM14 24h6v8h-6z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
<header class="masthead">
<div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>断刀<span class="brand-divider">/</span><small>锻刀大会</small></span></div>
<div class="edition"><span class="status-light"></span>十二系锻造工坊 <span class="edition-tag">试玩版</span><a class="header-ranking" href="./leaderboard.html" target="_blank" rel="noopener">排行榜 ↗</a><button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="true" aria-label="锻造音效" title="关闭锻造音效">音效 开</button></div>
</header>
<main class="workbench">
<section class="viewport-panel" aria-label="立体像素锻造场景">
<div class="scene-heading"><span id="scene-label">炉火未熄，命运未定</span><span class="scene-index" id="scene-index">THE FORGE / 01</span></div>
<div id="scene" role="img" aria-label="正在加载三维锻造工坊"><div class="loading" id="loading"><span class="loading-rune">✦</span>正在点燃炉火…</div></div>
<div id="impact-label" class="impact-label" aria-hidden="true"></div>
<div id="evolution-label" class="evolution-label" aria-live="polite"></div>
<div class="scene-caption"><span id="scene-caption">选定刀胚，落锤之后才会进化。</span><span class="view-mark" aria-hidden="true">◇</span></div>
</section>
<section class="control-panel" id="panel" aria-label="锻造操作"><p class="muted">准备工坊中…</p></section>
</main>
<footer class="page-footer"><span>一把刀，十五次命运。</span><span id="session-note">自由试玩 · 本局结果不参与活动排名</span></footer>
</div>
<script type="module">
import('./app.mjs').catch(error => {
 console.error(error);
 const loading=document.getElementById('loading');
 if(loading) loading.textContent='工坊加载失败，请刷新重试。';
 document.getElementById('panel').innerHTML='<p role="alert">暂时无法打开三维工坊。请使用支持 WebGL 2 的浏览器，并刷新重试。</p>';
});
</script>
</body>
</html>
